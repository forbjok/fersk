name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run workflow without actually publishing
        type: boolean
        default: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
          python-version: ">=3.15"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc i686-pc-windows-msvc

      - name: Build
        run: uv run build.py win64 win32 chocolatey

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          files: "dist/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
